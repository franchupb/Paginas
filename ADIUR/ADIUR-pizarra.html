<img class="logo-superior" src="ADIUR-Logo ADIUR.jpg" alt="Logo ADIUR" onerror="this.style.display='none'">
<div class="titulo-superior"><h1>ADIUR FEMENINO</h1><p>Pizarra táctica</p></div>
<button class="perfil" type="button" aria-label="Perfil de usuario"><span class="avatar" id="avatarUsuario">U</span><span class="informacion-perfil"><span class="nombre-perfil" id="nombreUsuario">Usuario</span><span class="rol-perfil" id="rolUsuario">Club ADIUR</span></span></button>
</header>
<div class="capa-sidebar" id="capaSidebar" aria-hidden="true"></div>
<div class="contenedor" id="layoutContenedor">
<aside class="sidebar" id="sidebar" aria-label="Navegación principal"></aside>
<main class="main" id="main">
<section class="pizarra-app" aria-label="Pizarra táctica">
  <div class="selector-equipos">
    <div class="selector-equipo">
      <label for="categoriaADIUR">PLANTEL ADIUR</label>
      <select id="categoriaADIUR"><option value="">Seleccionar categoría</option><option>Sub 10</option><option>Sub 12</option><option>Sub 14</option><option>Sub 16</option><option>Primera</option></select>
      <select id="formacionADIUR" aria-label="Formación ADIUR"><option>4-3-3</option><option>4-4-2</option><option>4-2-3-1</option><option>3-5-2</option><option>5-3-2</option></select>
    </div>
    <div class="selector-equipo rival-selector">
      <label for="formacionRival">PLANTEL RIVAL</label>
      <span class="selector-ayuda">Opcional · convive con ADIUR</span>
      <select id="formacionRival" aria-label="Formación rival"><option value="">Sin rival</option><option>4-3-3</option><option>4-4-2</option><option>4-2-3-1</option><option>3-5-2</option><option>5-3-2</option></select>
    </div>
    <div class="acciones-pizarra"><button class="accion-icono" id="undo" type="button" title="Deshacer" aria-label="Deshacer">↶</button><button class="accion-icono" id="redo" type="button" title="Rehacer" aria-label="Rehacer">↷</button><button class="accion-icono" id="clearDrawings" type="button" title="Borrar trazos" aria-label="Borrar trazos">⌫</button></div>
  </div>
  <div class="workspace">
    <aside class="tools" aria-label="Herramientas de la pizarra">
      <div class="tools-label">HERRAMIENTAS</div>
      <button class="tool active" data-tool="select" type="button" title="Seleccionar y mover"><span>↖</span><small>Mover</small></button>
      <button class="tool" data-tool="line" type="button" title="Dibujar línea"><span>／</span><small>Línea</small></button>
      <button class="tool" data-tool="arrow" type="button" title="Dibujar flecha"><span>➜</span><small>Flecha</small></button>
      <button class="tool" data-tool="dash" type="button" title="Dibujar línea discontinua"><span>┄</span><small>Discontinua</small></button>
      <button class="tool" data-tool="zone" type="button" title="Dibujar zona"><span>◯</span><small>Zona</small></button>
      <button class="tool" data-tool="free" type="button" title="Lápiz de mano alzada"><span>✎</span><small>Lápiz</small></button>
      <div class="color-tools"><div class="tools-label">COLOR</div><div class="colors"><button class="color active" data-color="#ffffff" type="button" aria-label="Blanco"></button><button class="color" data-color="#f47721" type="button" aria-label="Naranja"></button><button class="color" data-color="#ffe15a" type="button" aria-label="Amarillo"></button><button class="color" data-color="#e94b4b" type="button" aria-label="Rojo"></button><button class="color" data-color="#55c8ff" type="button" aria-label="Celeste"></button><button class="color" data-color="#171717" type="button" aria-label="Negro"></button></div></div>
      <div class="width-tools"><label for="lineWidth">GROSOR</label><input id="lineWidth" type="range" min="2" max="10" value="4"></div>
    </aside>
    <div class="pitchwrap"><div class="pitch" id="pitch"><svg class="field-svg" id="fieldSvg" viewBox="0 0 900 600" preserveAspectRatio="none" aria-hidden="true"></svg><canvas class="drawing-canvas" id="draw"></canvas><div id="players"></div></div></div>
  </div>
  <div class="estado-pizarra" id="status" role="status" aria-live="polite">Seleccioná una categoría para cargar la formación de ADIUR.</div>
</section>
</main>
</div>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
(()=>{
"use strict";
const $=id=>document.getElementById(id),pitch=$("pitch"),canvas=$("draw"),ctx=canvas.getContext("2d");
const firebaseConfig={apiKey:"AIzaSyCc0dPIEkaKxbHoRC2CgZK412dXVGPOdTI",authDomain:"adiur-b1913.firebaseapp.com",projectId:"adiur-b1913",storageBucket:"adiur-b1913.firebasestorage.app",messagingSenderId:"884643321144",appId:"1:884643321144:web:ba3c314de3a1c9e3545dcd",measurementId:"G-58LL26YXPM"};
const app=getApps().length?getApp():initializeApp(firebaseConfig),db=getFirestore(app);
const formations={
"4-3-3":[[.12,.50],[.30,.18],[.30,.39],[.30,.61],[.30,.82],[.52,.28],[.52,.50],[.52,.72],[.78,.18],[.82,.50],[.78,.82]],
"4-4-2":[[.12,.50],[.30,.18],[.30,.39],[.30,.61],[.30,.82],[.53,.18],[.53,.39],[.53,.61],[.53,.82],[.79,.36],[.79,.64]],
"4-2-3-1":[[.12,.50],[.30,.18],[.30,.39],[.30,.61],[.30,.82],[.48,.38],[.48,.62],[.68,.18],[.68,.50],[.68,.82],[.84,.50]],
"3-5-2":[[.12,.50],[.30,.25],[.30,.50],[.30,.75],[.52,.12],[.52,.31],[.52,.50],[.52,.69],[.52,.88],[.80,.36],[.80,.64]],
"5-3-2":[[.12,.50],[.29,.12],[.29,.31],[.29,.50],[.29,.69],[.29,.88],[.55,.28],[.55,.50],[.55,.72],[.82,.36],[.82,.64]]
};
let players=[],drawings=[],tool="select",color="#ffffff",lineWidth=4,selected=null,drawing=false,start=null,points=[],history=[],future=[],rivalFormation="";
const clone=x=>JSON.parse(JSON.stringify(x)),say=t=>$("status").textContent=t;
function snapshot(){history.push({players:clone(players),drawings:clone(drawings)});if(history.length>50)history.shift();future=[];buttons()}
function buttons(){$("undo").disabled=!history.length;$("redo").disabled=!future.length}
function normalizar(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")}
function categoriaMatch(a,b){return normalizar(a)===normalizar(b)}
function positionRank(p){const x=normalizar(p);if(x.includes("arquera")||x.includes("portera"))return 0;if(x.includes("defensora")||x.includes("defensa"))return 1;if(x.includes("mediocampista")||x.includes("volante"))return 2;if(x.includes("delantera")||x.includes("delantera"))return 3;return 4}
function setField(){
 const svg=$("fieldSvg");
 svg.innerHTML='<rect width="900" height="600" fill="#328452"/><g fill="none" stroke="#ffffff" stroke-width="4"><rect x="15" y="15" width="870" height="570"/><line x1="450" y1="15" x2="450" y2="585"/><circle cx="450" cy="300" r="78"/><circle cx="450" cy="300" r="5" fill="#fff"/><rect x="15" y="155" width="135" height="290"/><rect x="15" y="225" width="55" height="150"/><rect x="750" y="155" width="135" height="290"/><rect x="830" y="225" width="55" height="150"/></g>';
}
function xy(e){const r=pitch.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function drawOne(d,g=ctx){
 const r=pitch.getBoundingClientRect(),x=d.x*r.width,y=d.y*r.height,X=d.X*r.width,Y=d.Y*r.height;
 g.save();g.strokeStyle=d.color;g.fillStyle=d.color;g.lineWidth=d.width;g.lineCap="round";g.lineJoin="round";g.setLineDash(d.type==="dash"?[10,8]:[]);g.beginPath();
 if(d.type==="free"){(d.points||[]).forEach((p,i)=>i?g.lineTo(p.x*r.width,p.y*r.height):g.moveTo(p.x*r.width,p.y*r.height))}
 else if(d.type==="zone")g.ellipse((x+X)/2,(y+Y)/2,Math.max(2,Math.abs(X-x)/2),Math.max(2,Math.abs(Y-y)/2),0,0,Math.PI*2);
 else{g.moveTo(x,y);g.lineTo(X,Y);if(d.type==="arrow"){const a=Math.atan2(Y-y,X-x),len=16+d.width;g.moveTo(X,Y);g.lineTo(X-len*Math.cos(a-.48),Y-len*Math.sin(a-.48));g.moveTo(X,Y);g.lineTo(X-len*Math.cos(a+.48),Y-len*Math.sin(a+.48))}}
 g.stroke();g.restore();
}
function paint(){const r=pitch.getBoundingClientRect();if(!r.width||!r.height)return;ctx.clearRect(0,0,r.width,r.height);drawings.forEach(d=>drawOne(d));if(drawing&&start&&points.length)drawOne({type:tool,x:start.x,y:start.y,X:points.at(-1).x,Y:points.at(-1).y,points,color,width:lineWidth})}
function renderPlayers(){
 const host=$("players");host.replaceChildren();
 players.forEach(p=>{const el=document.createElement("div");el.className="player "+p.team+(p.id===selected?" selected":"");el.style.left=p.x*100+"%";el.style.top=p.y*100+"%";el.textContent=p.number;const label=document.createElement("small");label.textContent=p.name;el.append(label);
 el.addEventListener("pointerdown",e=>{if(tool!=="select")return;e.preventDefault();e.stopPropagation();snapshot();selected=p.id;const move=v=>{const q=xy(v);p.x=Math.max(.025,Math.min(.975,q.x));p.y=Math.max(.035,Math.min(.965,q.y));el.style.left=p.x*100+"%";el.style.top=p.y*100+"%"};const end=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",end);renderPlayers();say("Posición actualizada");buttons()};window.addEventListener("pointermove",move);window.addEventListener("pointerup",end,{once:true})});
 host.append(el)});
}
function resize(){const r=pitch.getBoundingClientRect(),d=window.devicePixelRatio||1;if(!r.width||!r.height)return;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);paint()}
function layoutTeam(team,formation){
 const coords=formations[formation];if(!coords)return;
 const group=players.filter(p=>p.team===team);
 group.forEach((p,i)=>{const q=coords[i];p.x=team==="rival"?1-q[0]:q[0];p.y=q[1]});
}
function updateOwnFormation(){
 const cat=$("categoriaADIUR").value,formation=$("formacionADIUR").value;
 if(!cat){players=players.filter(p=>p.team!=="own");renderPlayers();paint();say("Seleccioná una categoría para cargar ADIUR.");return}
 const squad=jugadoras.filter(j=>categoriaMatch(j.categoria,cat)&&normalizar(j.estado||"Activo")!=="inactivo"&&normalizar(j.estado||"Activo")!=="lesionado").sort((a,b)=>positionRank(a.posicion)-positionRank(b.posicion)||String(a.nombre).localeCompare(String(b.nombre),"es"));
 snapshot();players=players.filter(p=>p.team!=="own");
 const coords=formations[formation];
 squad.slice(0,11).forEach((j,i)=>{const q=coords[i];players.push({id:"own-"+j.id,team:"own",name:j.nombre,number:String(j.dorsal||j.numero||i+1),x:q[0],y:q[1]})});
 renderPlayers();paint();say(squad.length?("ADIUR · "+cat+" · "+Math.min(squad.length,11)+" de "+squad.length+" jugadoras ubicadas"):"No hay jugadoras activas cargadas en "+cat+".");
}
function updateRival(){
 const formation=$("formacionRival").value;snapshot();players=players.filter(p=>p.team!=="rival");rivalFormation=formation;
 if(formation){formations[formation].forEach((q,i)=>players.push({id:"rival-"+(i+1),team:"rival",name:"Rival "+(i+1),number:String(i+1),x:1-q[0],y:q[1]}))}
 renderPlayers();paint();say(formation?"Formación rival "+formation+" agregada a la cancha.":"Se quitó la formación rival.");
}
let jugadoras=[];
function onJugadoras(snapshotData){
 jugadoras=[];snapshotData.forEach(docSnap=>{const d=docSnap.data();jugadoras.push({...d,id:docSnap.id,nombre:d.nombre||d.nombreCompleto||d.nombre_completo||[d.nombres,d.apellido||d.apellidos].filter(Boolean).join(" "),categoria:d.categoria||d.division||d.categoría||d.category||"",posicion:d.posicion||d.puesto||"",estado:d.estado||d.status||"Activo",dorsal:d.dorsal||d.numeroCamiseta||d.numero||""})});
 if($("categoriaADIUR").value)updateOwnFormation();else say("Elegí la categoría para cargar la formación de ADIUR.");
}
$("categoriaADIUR").addEventListener("change",updateOwnFormation);
$("formacionADIUR").addEventListener("change",updateOwnFormation);
$("formacionRival").addEventListener("change",updateRival);
document.querySelectorAll("[data-tool]").forEach(b=>b.addEventListener("click",()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("active",x===b));say("Herramienta seleccionada: "+b.querySelector("small").textContent)}));
document.querySelectorAll("[data-color]").forEach(b=>b.addEventListener("click",()=>{color=b.dataset.color;document.querySelectorAll("[data-color]").forEach(x=>x.classList.toggle("active",x===b))}));
$("lineWidth").addEventListener("input",e=>lineWidth=Number(e.target.value));
canvas.addEventListener("pointerdown",e=>{if(tool==="select")return;e.preventDefault();drawing=true;start=xy(e);points=[start];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=xy(e);if(tool==="free")points.push(p);else points=[start,p];paint()});
canvas.addEventListener("pointerup",e=>{if(!drawing)return;drawing=false;const end=xy(e);if(Math.hypot(end.x-start.x,end.y-start.y)<.004&&tool!=="free"){paint();return}snapshot();drawings.push(tool==="free"?{type:"free",points:clone(points),x:start.x,y:start.y,X:end.x,Y:end.y,color,width:lineWidth}:{type:tool,x:start.x,y:start.y,X:end.x,Y:end.y,color,width:lineWidth});points=[];paint();say("Trazo incorporado a la pizarra.")});
canvas.addEventListener("pointercancel",()=>{drawing=false;points=[];paint()});
$("undo").addEventListener("click",()=>{if(!history.length)return;future.push({players:clone(players),drawings:clone(drawings)});const s=history.pop();players=s.players;drawings=s.drawings;renderPlayers();paint();buttons();say("Último cambio deshecho.")});
$("redo").addEventListener("click",()=>{if(!future.length)return;history.push({players:clone(players),drawings:clone(drawings)});const s=future.pop();players=s.players;drawings=s.drawings;renderPlayers();paint();buttons();say("Cambio recuperado.")});
$("clearDrawings").addEventListener("click",()=>{if(!drawings.length)return;snapshot();drawings=[];paint();say("Trazos borrados.")});
setField();buttons();new ResizeObserver(resize).observe(pitch);window.addEventListener("resize",resize);
onSnapshot(collection(db,"jugadoras"),onJugadoras,error=>{console.error(error);say("No se pudo cargar el plantel desde Firebase. Revisá la conexión o los permisos.")});
})();
</script>
<script src="ADIUR-layout.js?v=20261123-pizarra4"></script>
</body>
</html>
