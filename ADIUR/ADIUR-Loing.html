<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#171717"
    >

    <meta
        name="description"
        content="Inicio de sesión de ADIUR FEMENINO. Accedé al sistema de gestión del club."
    >

    <title>Iniciar sesión | ADIUR FEMENINO</title>

    <style>
        /* =====================================================
           IDENTIDAD VISUAL ADIUR FEMENINO
        ===================================================== */

        :root {
            --naranja: #f47721;
            --naranja-oscuro: #dc5e0b;
            --naranja-claro: #fff0e6;

            --negro: #171717;
            --negro-suave: #262626;

            --blanco: #ffffff;
            --fondo: #f6f6f6;
            --gris: #f4f5f7;
            --gris-texto: #747474;
            --borde: #e5e5e5;

            --rojo: #c62828;
            --rojo-fondo: #fde9e9;

            --radio: 18px;
            --sombra: 0 24px 65px rgba(0, 0, 0, 0.30);
        }

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family: Arial, Helvetica, sans-serif;
            color: var(--negro);

            background-color: #202020;

            background-image:
                linear-gradient(
                    135deg,
                    rgba(18, 18, 18, 0.76),
                    rgba(25, 25, 25, 0.58),
                    rgba(18, 18, 18, 0.78)
                ),
                url("ADIUR-Familia.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid rgba(244, 119, 33, 0.55);
            outline-offset: 3px;
        }

        /* =====================================================
           CONTENEDOR PRINCIPAL
        ===================================================== */

        .login-container {
            position: relative;

            width: 100%;
            max-width: 430px;

            overflow: hidden;

            background: rgba(255, 255, 255, 0.98);

            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: var(--radio);

            box-shadow: var(--sombra);

            text-align: center;

            animation: aparecer 0.45s ease-out;
        }

        /* Franja superior naranja */

        .franja-superior {
            width: 100%;
            height: 7px;

            background: linear-gradient(
                90deg,
                var(--naranja-oscuro),
                var(--naranja),
                #ffad70
            );
        }

        .login-contenido {
            padding: 35px 36px 27px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           LOGO DEL CLUB
        ===================================================== */

        .logo-contenedor {
            display: flex;
            align-items: center;
            justify-content: center;

            margin: 2px 0 19px;
        }

        .logo {
            display: block;

            width: 112px;
            height: 112px;

            object-fit: contain;

            padding: 4px;

            background: var(--blanco);

            border-radius: 100%;
        }

        /* =====================================================
           IDENTIDAD Y TÍTULOS
        ===================================================== */

        .etiqueta-club {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;

            margin-bottom: 13px;

            color: var(--naranja-oscuro);

            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .etiqueta-punto {
            width: 6px;
            height: 6px;

            background: var(--naranja);
            border-radius: 50%;
        }

        h1 {
            color: var(--negro);

            font-size: 26px;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: -0.5px;

            margin-bottom: 8px;
        }

        .subtitulo {
            color: var(--gris-texto);

            font-size: 13px;
            line-height: 1.6;

            margin-bottom: 24px;
        }

        .separador {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;

            margin-bottom: 25px;
        }

        .separador::before {
            content: "";

            width: 54px;
            height: 4px;

            border-radius: 10px;
            background: var(--naranja);
        }

        /* =====================================================
           CABECERA DEL FORMULARIO
        ===================================================== */

        .formulario-cabecera {
            text-align: left;
            margin-bottom: 21px;
        }

        .formulario-cabecera h2 {
            color: var(--negro);

            font-size: 17px;
            font-weight: 900;

            margin-bottom: 5px;
        }

        .formulario-cabecera p {
            color: var(--gris-texto);

            font-size: 12px;
            line-height: 1.5;
        }

        /* =====================================================
           CAMPOS DEL FORMULARIO
        ===================================================== */

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            margin-bottom: 8px;

            color: #333333;

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.1px;
        }

        .campo input {
            display: block;

            width: 100%;
            min-height: 49px;

            padding: 13px 14px;

            border: 1px solid #dcdcdc;
            border-radius: 10px;

            background: #ffffff;

            color: var(--negro);

            font-size: 13px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .campo input::placeholder {
            color: #a0a0a0;
            opacity: 1;
        }

        .campo input:hover {
            border-color: #c5c5c5;
        }

        .campo input:focus {
            border-color: var(--naranja);

            box-shadow:
                0 0 0 3px rgba(244, 119, 33, 0.12);

            background: #ffffff;
        }

        .campo input[aria-invalid="true"] {
            border-color: var(--rojo);

            box-shadow:
                0 0 0 3px rgba(198, 40, 40, 0.08);
        }

        /* =====================================================
           CONTRASEÑA Y VISIBILIDAD
        ===================================================== */

        .contenedor-contrasena {
            position: relative;
        }

        .contenedor-contrasena input {
            padding-right: 74px;
        }

        .boton-ver-contrasena {
            position: absolute;

            top: 50%;
            right: 8px;

            transform: translateY(-50%);

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 32px;

            padding: 0 8px;

            border: none;
            border-radius: 7px;

            background: transparent;

            color: #626262;

            font-size: 11px;
            font-weight: 800;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .boton-ver-contrasena:hover {
            background: var(--naranja-claro);
            color: var(--naranja-oscuro);
        }

        /* =====================================================
           BOTÓN DE INICIO DE SESIÓN
        ===================================================== */

        .boton-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;

            width: 100%;
            min-height: 50px;

            margin-top: 7px;
            padding: 14px 18px;

            border: 1px solid var(--naranja);
            border-radius: 10px;

            background: var(--naranja);
            color: var(--blanco);

            font-size: 12px;
            font-weight: 900;
            letter-spacing: 0.8px;

            box-shadow:
                0 5px 12px rgba(244, 119, 33, 0.17);

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .boton-login:hover {
            background: var(--naranja-oscuro);
            border-color: var(--naranja-oscuro);

            box-shadow:
                0 7px 17px rgba(220, 94, 11, 0.24);

            transform: translateY(-1px);
        }

        .boton-login:active {
            transform: translateY(0);
        }

        .boton-login:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        .texto-boton {
            line-height: 1.2;
        }

        .icono-ingreso {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
            line-height: 1;
        }

        /* =====================================================
           MENSAJE DE ERROR
        ===================================================== */

        .error {
            display: none;

            margin-top: 16px;
            padding: 12px 13px;

            border: 1px solid #f3cccc;
            border-radius: 9px;

            background: var(--rojo-fondo);
            color: var(--rojo);

            font-size: 12px;
            font-weight: 700;
            line-height: 1.5;

            text-align: left;
        }

        .error.visible {
            display: block;

            animation: mostrarError 0.2s ease-out;
        }

        @keyframes mostrarError {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           PIE DEL LOGIN
        ===================================================== */

        .pie-login {
            margin-top: 26px;
            padding-top: 19px;

            border-top: 1px solid #eeeeee;

            color: var(--gris-texto);

            font-size: 10px;
            line-height: 1.7;
        }

        .pie-login strong {
            display: block;

            margin-bottom: 3px;

            color: #404040;

            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.1px;
        }

        .pie-login span {
            color: var(--naranja-oscuro);
            font-weight: 700;
        }

        /* =====================================================
           RESPONSIVE: CELULARES Y TABLETS
        ===================================================== */

        @media (max-width: 500px) {
            body {
                padding: 16px;

                background-attachment: scroll;
                background-position: center center;
            }

            .login-container {
                max-width: 420px;
                border-radius: 16px;
            }

            .login-contenido {
                padding: 28px 23px 23px;
            }

            .logo {
                width: 96px;
                height: 96px;
            }

            .logo-contenedor {
                margin-bottom: 16px;
            }

            h1 {
                font-size: 23px;
            }

            .subtitulo {
                font-size: 12px;
                margin-bottom: 22px;
            }

            .formulario-cabecera h2 {
                font-size: 16px;
            }

            .campo {
                margin-bottom: 16px;
            }

            .pie-login {
                margin-top: 23px;
                padding-top: 16px;
            }
        }

        @media (max-width: 360px) {
            body {
                padding: 11px;
            }

            .login-contenido {
                padding: 26px 18px 21px;
            }

            .logo {
                width: 84px;
                height: 84px;
            }

            h1 {
                font-size: 21px;
            }

            .campo input {
                min-height: 46px;
            }

            .boton-login {
                min-height: 47px;
            }
        }

        /* =====================================================
           PANTALLAS CON POCA ALTURA
        ===================================================== */

        @media (max-height: 650px) and (min-width: 501px) {
            body {
                align-items: flex-start;
                padding-top: 18px;
                padding-bottom: 18px;
            }

            .login-contenido {
                padding-top: 23px;
                padding-bottom: 20px;
            }

            .logo {
                width: 78px;
                height: 78px;
            }

            .logo-contenedor {
                margin-bottom: 12px;
            }

            .subtitulo {
                margin-bottom: 16px;
            }

            .separador {
                margin-bottom: 18px;
            }

            .formulario-cabecera {
                margin-bottom: 16px;
            }

            .campo {
                margin-bottom: 13px;
            }

            .pie-login {
                margin-top: 19px;
                padding-top: 14px;
            }
        }

        /* =====================================================
           ACCESIBILIDAD
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    
        /* =====================================================
           PANTALLA INICIAL CON ESCUDO Y FRASE INSTITUCIONAL
           Se conserva la fotografía original de fondo del club.
        ===================================================== */
        .pantalla-inicial {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: 24px;
            text-align: center;
            background: transparent;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        .boton-escudo {
            width: clamp(190px, 27vw, 280px);
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            border: 2px solid rgba(255,255,255,0.88);
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 20px 65px rgba(0,0,0,0.32), 0 0 0 12px rgba(255,255,255,0.13);
            cursor: pointer;
            animation: flotarEscudo 3.2s ease-in-out infinite;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .boton-escudo:hover {
            transform: scale(1.045);
            box-shadow: 0 25px 75px rgba(0,0,0,0.38), 0 0 0 16px rgba(255,255,255,0.16);
        }

        .boton-escudo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            overflow: hidden;
            clip-path: circle(50%);
        }

        .frase-institucional {
            max-width: min(90vw, 760px);
            color: #fff;
            text-shadow: 0 3px 18px rgba(0,0,0,0.72);
        }

        .frase-institucional h2 {
            margin: 0 0 10px;
            font-size: clamp(23px, 3.2vw, 38px);
            line-height: 1.12;
            font-weight: 900;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .frase-institucional p {
            margin: 0;
            font-size: clamp(12px, 1.4vw, 15px);
            line-height: 1.6;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .login-container {
            display: none;
            opacity: 0;
            transform: translateY(16px);
        }

        body.login-activo .pantalla-inicial {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        body.login-activo .login-container {
            display: block;
            animation: mostrarFormulario 0.55s ease forwards;
        }

        @keyframes flotarEscudo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes mostrarFormulario {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            .boton-escudo {
                width: min(68vw, 245px);
                padding: 15px;
            }
            .frase-institucional h2 {
                font-size: clamp(21px, 6vw, 29px);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .boton-escudo { animation: none; }
        }

    
        /* Elementos laterales: aparecen junto al formulario, como en SAN JORGE */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 8% 50%, rgba(255,255,255,0.10), transparent 28%),
                radial-gradient(ellipse at 92% 50%, rgba(0,0,0,0.16), transparent 30%);
        }

        .detalle-lateral {
            position: fixed;
            top: 50%;
            z-index: 1;
            transform: translateY(-50%);
            width: min(23vw, 270px);
            color: rgba(255,255,255,0.94);
            pointer-events: none;
            text-shadow: 0 2px 18px rgba(0,0,0,0.45);
            opacity: 0;
            transition: opacity 0.7s ease 0.15s;
        }

        .detalle-izquierdo { 
            isolation: isolate;
        }
        
        .detalle-izquierdo > * {
            position: relative;
            z-index: 1;
        }

        .detalle-derecho {
            right: clamp(22px, 5vw, 78px);
            text-align: right;
        }

        .detalle-lateral .detalle-linea {
            display: block;
            width: 46px;
            height: 4px;
            margin-bottom: 19px;
            border-radius: 8px;
            background: linear-gradient(90deg, #ffffff, rgba(255,255,255,0.25));
        }

        .detalle-derecho .detalle-linea {
            margin-left: auto;
            background: linear-gradient(90deg, rgba(255,255,255,0.25), #ffffff);
        }

        .detalle-lateral strong {
            display: block;
            font-size: clamp(18px, 2.05vw, 28px);
            line-height: 1.12;
            letter-spacing: 1.3px;
            font-weight: 900;
        }

        .detalle-lateral span:not(.detalle-linea) {
            display: block;
            margin-top: 12px;
            font-size: 10px;
            line-height: 1.8;
            letter-spacing: 2px;
            font-weight: 800;
            text-transform: uppercase;
            color: rgba(255,255,255,0.82);
        }

        .login-container {
            display: none;
            opacity: 0;
            transform: translateY(16px);
            position: relative;
            z-index: 2;
        }

        body.login-activo .pantalla-inicial {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        body.login-activo .login-container {
            display: block;
            animation: mostrarFormulario 0.55s ease forwards;
        }

        body.login-activo .detalle-lateral {
            opacity: 1;
        }

        @keyframes mostrarFormulario {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 900px) {
            .detalle-lateral { display: none; }
        }

    
/* En móviles se usa el fondo degradado para evitar descargar
   la fotografía original de 19 MB durante el inicio de sesión. */
@media (max-width: 760px) {
  body {
    background-image: linear-gradient(135deg, rgba(18,18,18,.82), rgba(25,25,25,.68), rgba(18,18,18,.84));
    background-attachment: scroll;
  }
}

</style>
</head>

<body>

    <section class="pantalla-inicial" id="pantallaInicial" aria-label="Acceso a ADIUR FEMENINO">
        <button type="button" class="boton-escudo" id="botonAcceso" aria-label="Ingresar al sistema de ADIUR FEMENINO">
            <img src="ADIUR-Logo ADIUR.jpg" alt="Escudo de ADIUR FEMENINO">
        </button>
        </section>


    
    <div class="detalle-lateral detalle-derecho" aria-hidden="true">
        <span class="detalle-linea"></span>
        <strong>UNIÓN<br>PASIÓN<br>COMPROMISO</strong>
        <span>Orgullo de pertenecer</span>
    </div>

<main class="login-container">

        <div class="franja-superior" aria-hidden="true"></div>

        <div class="login-contenido">

            <!-- LOGO OFICIAL DE ADIUR -->
            <div class="logo-contenedor">
                <img
                    src="CLUBES/ADIUR.jpeg"
                    alt="Escudo de ADIUR"
                    class="logo"
                    onerror="if(!this.dataset.intento){this.dataset.intento='1';this.src='ADIUR-Logo ADIUR.jpg'}else{this.style.display='none'}"
                >
            </div>

            <!-- IDENTIDAD DEL CLUB -->
            <div class="etiqueta-club">
                <span class="etiqueta-punto" aria-hidden="true"></span>
                CLUB DEPORTIVO
            </div>

            <h1>ADIUR FEMENINO</h1>

            <p class="subtitulo">
                Pasión, compromiso y trabajo en equipo
            </p>

            <div class="separador" aria-hidden="true"></div>

            <!-- CABECERA DEL FORMULARIO -->
            <div class="formulario-cabecera">
                <p></p>
            </div>

            <!-- FORMULARIO -->
            <form id="loginForm" novalidate>

                <!-- USUARIO -->
                <div class="campo">
                    <label for="usuario">Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresá tu usuario"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        aria-describedby="mensajeError"
                        required
                    >
                </div>

                <!-- CONTRASEÑA -->
                <div class="campo">
                    <label for="contrasena">Contraseña</label>

                    <div class="contenedor-contrasena">
                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Ingresá tu contraseña"
                            autocomplete="current-password"
                            aria-describedby="mensajeError"
                            required
                        >

                        <button
                            type="button"
                            class="boton-ver-contrasena"
                            id="botonVerContrasena"
                            aria-label="Mostrar contraseña"
                            aria-pressed="false"
                        >
                            Mostrar
                        </button>
                    </div>
                </div>

                <!-- BOTÓN -->
                <button
                    type="submit"
                    class="boton-login"
                    id="botonLogin"
                >
                    <span class="texto-boton" id="textoBoton">
                        INICIAR SESIÓN
                    </span>

                    <span class="icono-ingreso" aria-hidden="true">→</span>
                </button>

                <!-- MENSAJE DE ERROR -->
                <div
                    class="error"
                    id="mensajeError"
                    role="alert"
                    aria-live="assertive"
                    aria-atomic="true"
                >
                    Usuario o contraseña incorrectos.
                </div>

            </form>

            <!-- PIE INSTITUCIONAL -->
            <footer class="pie-login">
                <strong></strong>
    <script type="module">
        import { iniciarSesionADIUR } from "./ADIUR-auth.js?v=20261123-authpersist1";
        "use strict";
        const loginForm=document.getElementById("loginForm");
        const campoUsuario=document.getElementById("usuario");
        const campoContrasena=document.getElementById("contrasena");
        const mensajeError=document.getElementById("mensajeError");
        const botonLogin=document.getElementById("botonLogin");
        const textoBoton=document.getElementById("textoBoton");
        const botonVerContrasena=document.getElementById("botonVerContrasena");
        const botonAcceso=document.getElementById("botonAcceso");
        if(botonAcceso) botonAcceso.addEventListener("click",()=> {
          document.body.classList.add("login-activo");
          window.setTimeout(()=>campoUsuario.focus({preventScroll:true}),500);
        });
        botonVerContrasena?.addEventListener("click",()=>{
          const visible=campoContrasena.type==="password";
          campoContrasena.type=visible?"text":"password";
          botonVerContrasena.textContent=visible?"Ocultar":"Mostrar";
          botonVerContrasena.setAttribute("aria-label",visible?"Ocultar contraseña":"Mostrar contraseña");
          botonVerContrasena.setAttribute("aria-pressed",String(visible));
        });
        function ocultarError(){
          mensajeError.classList.remove("visible");
          campoUsuario.removeAttribute("aria-invalid");
          campoContrasena.removeAttribute("aria-invalid");
        }
        function mostrarError(mensaje,campo=null){
          mensajeError.textContent=mensaje;
          mensajeError.classList.add("visible");
          if(campo){campo.setAttribute("aria-invalid","true");campo.focus();}
        }
        campoUsuario.addEventListener("input",ocultarError);
        campoContrasena.addEventListener("input",ocultarError);
        loginForm.addEventListener("submit",async event=>{
          event.preventDefault(); ocultarError();
          const usuario=campoUsuario.value.trim();
          const contrasena=campoContrasena.value;
          if(!usuario){mostrarError("Ingresá tu nombre de usuario.",campoUsuario);return;}
          if(!contrasena){mostrarError("Ingresá tu contraseña.",campoContrasena);return;}
          botonLogin.disabled=true;
          if(textoBoton) textoBoton.textContent="CONECTANDO...";
          try{
            await iniciarSesionADIUR(usuario,contrasena);
            window.location.href="ADIUR-Pagina Principal.html";
          }catch(error){
            console.error("Error de autenticación ADIUR:",error);
            const mensajes={
              "auth/invalid-credential":"Usuario o contraseña incorrectos.",
              "auth/user-not-found":"Usuario o contraseña incorrectos.",
              "auth/wrong-password":"Usuario o contraseña incorrectos.",
              "auth/too-many-requests":"Se bloquearon temporalmente los intentos. Esperá unos minutos.",
              "auth/network-request-failed":"No se pudo conectar. Revisá tu conexión a internet."
            };
            mostrarError(mensajes[error.code]||error.message||"No se pudo iniciar sesión.");
            campoContrasena.value="";
          }finally{
            botonLogin.disabled=false;
            if(textoBoton) textoBoton.textContent="INICIAR SESIÓN";
          }
        });
        document.addEventListener("DOMContentLoaded",()=>{if(!document.body.classList.contains("login-activo"))campoUsuario.focus({preventScroll:true});});
    </script>

</body>
</html>
