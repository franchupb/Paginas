name: ADIUR syntax and Firestore rules validation

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:
    branches:
      - master

jobs:
  check-inline-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check inline JavaScript in ADIUR pages
        run: node scripts/check-adiur-html.mjs

  test-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Firebase test dependencies
        run: npm install --no-save firebase@10.12.2 @firebase/rules-unit-testing@3.0.3 firebase-tools
      - name: Compile and test Firestore rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-adiur-rules --config scripts/firebase-emulator.json "node scripts/test-firestore-rules.mjs"
