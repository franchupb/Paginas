<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#102b4b">
<title>Multimedia | SAN TELMO</title>
<style>
:root{--azul:#174a7e;--rojo:#a51e36;--fondo:#f3f6fa;--texto:#172033;--suave:#65748a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Inter,Arial,sans-serif;color:var(--texto);background:radial-gradient(circle at 10% 0%,#dce9f6,transparent 42%),linear-gradient(135deg,#f7f9fc,#eaf0f7)}
main{width:min(100%,560px);padding:38px 30px;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 22px 65px #102b4b18}
img{width:104px;height:104px;object-fit:contain;margin-bottom:18px}
.etiqueta{display:inline-block;padding:7px 11px;border-radius:999px;background:#eaf1f8;color:var(--azul);font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
h1{margin:17px 0 10px;font-size:clamp(25px,5vw,34px);letter-spacing:-.7px}
p{margin:0 auto;color:var(--suave);font-size:14px;line-height:1.7;max-width:420px}
.estado{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:10px 13px;border:1px solid #f1d7dc;border-radius:12px;background:#fff7f8;color:var(--rojo);font-size:12px;font-weight:800}
.estado:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rojo)}
a{display:inline-flex;justify-content:center;align-items:center;margin-top:28px;min-height:45px;padding:0 18px;border-radius:11px;background:var(--azul);color:white;text-decoration:none;font-size:12px;font-weight:850}
a:hover{background:var(--rojo)}
@media(max-width:420px){main{padding:30px 20px}}
</style>
</head>
<body>
<main>
<img src="SAN TELMO.png" alt="Escudo de San Telmo">
<div class="etiqueta">SAN TELMO · Gestión deportiva</div>
<h1>Multimedia</h1>
<p>Este espacio está reservado para reunir fotografías y videos de entrenamientos, partidos y actividades del plantel.</p>
<div class="estado">Sección en preparación</div>
<br>
<a href="SAN TELMO-Pagina Principal.html">Volver al inicio</a>
</main>
</body>
</html>
