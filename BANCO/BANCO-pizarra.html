<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Pizarra táctica | SAN TELMO</title>
<style>
:root{--naranja:#c62828;--naranja2:#a00000;--negro:#171717;--gris:#f4f5f7;--texto:#747474;--borde:#e8e8e8;--verde:#dcebdc;--verde2:#cfe2d0}
*{box-sizing:border-box}
body{margin:0;background:#f5f6f7;color:var(--negro);font-family:Arial,Helvetica,sans-serif}
.contenedor{display:flex;min-height:calc(100vh - 84px)}
#sidebar{flex:0 0 258px;min-width:0}
.main{flex:1;min-width:0;padding:20px 22px;background:#f5f6f7}
.pizarra-shell{max-width:1800px;margin:auto}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;margin:0 0 15px}
.kicker{display:flex;align-items:center;gap:8px;margin:0 0 7px;color:var(--naranja2);font-size:10px;font-weight:900;letter-spacing:1.5px}
.kicker:before{content:"";width:20px;height:2px;background:var(--naranja)}
.intro h2{margin:0;font-size:clamp(23px,2.8vw,31px);letter-spacing:-.8px}
.intro p{margin:6px 0 0;color:#73777d;font-size:12px}
.intro-tag{padding:9px 12px;border:1px solid var(--borde);border-radius:9px;background:#fff;color:#697078;font-size:10px;font-weight:800;white-space:nowrap}
.studio{overflow:hidden;border:1px solid #e3e5e7;border-radius:15px;background:#fff;box-shadow:0 8px 28px #1717170c}
.studio-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid var(--borde);background:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--naranja);color:white;font-size:15px;font-weight:900;box-shadow:inset 0 1px #ffffff70}
.brand strong{display:block;font-size:11px;letter-spacing:.8px}
.brand small{display:block;margin-top:3px;color:#858990;font-size:9px;letter-spacing:.8px}
.actions,.control-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn,.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 11px;border:1px solid #e0e2e5;border-radius:8px;background:#fff;color:#333;font:700 10px Arial;cursor:pointer;transition:.15s}
.btn:hover,.icon-btn:hover{border-color:#eab4b4;background:#fff5f5}
.btn.primary{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.primary:hover{background:var(--naranja2)}
.btn:disabled,.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn{width:34px;padding:0;font-size:17px}
.controlbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--borde);background:#fbfbfc}
.control-group{display:flex;align-items:center;gap:8px}
.control-label{color:#858990;font-size:9px;font-weight:900;letter-spacing:1px}
select{height:34px;min-width:112px;padding:0 28px 0 10px;border:1px solid #dfe1e4;border-radius:8px;outline:none;background:#fff;color:#272727;font-size:10px;font-weight:800}
select:focus{border-color:var(--naranja);box-shadow:0 0 0 3px #c6282818}
.separator{width:1px;height:23px;background:#e4e5e7}
.spacer{flex:1}
.rival-strip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--borde);background:#fff8f3}
.rival-strip[hidden]{display:none}
.rival-strip strong{color:#a33c3c;font-size:10px}
.rival-strip small{color:#777;font-size:9px}
.workspace{display:grid;grid-template-columns:65px minmax(0,1fr);min-height:0}
.toolrail{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:10px 7px;border-right:1px solid var(--borde);background:#fff}
.rail-label{margin:3px 0 5px;color:#999;font-size:8px;font-weight:900;letter-spacing:1px;text-align:center}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:48px;padding:4px 2px;border:1px solid transparent;border-radius:8px;background:transparent;color:#73777d;cursor:pointer}
.tool span{font-size:19px;line-height:1}.tool small{font-size:8px;font-weight:800}
.tool:hover{background:#f7f7f7;color:#222}
.tool.active{border-color:#efbcbc;background:#fde9e9;color:#a00000}
.rail-divider{height:1px;margin:5px 2px;background:#eee}
.palette{display:grid;grid-template-columns:repeat(2,17px);justify-content:center;gap:8px;padding:4px 0}
.swatch{width:17px;height:17px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #c8cbd0;cursor:pointer}
.swatch.active{outline:2px solid var(--naranja);outline-offset:2px}
.width-control{display:flex;flex-direction:column;gap:5px;color:#858990;font-size:8px;font-weight:900;text-align:center}
.width-control input{width:100%;accent-color:var(--naranja)}
.pitch-stage{display:flex;flex-direction:column;min-width:0;padding:12px;background:#fff}
.pitch-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;color:#777;font-size:9px}
.pitch-meta strong{color:#282828;font-size:10px;letter-spacing:.6px}
.pitch-meta span{display:flex;align-items:center;gap:6px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#36a56c}
.pitch-wrap{display:flex;align-items:center;justify-content:center;min-width:0;min-height:360px;padding:8px;border:1px solid #e4e8e4;border-radius:10px;background:#f3f5f3}
.pitch{position:relative;width:100%;aspect-ratio:3/2;max-height:calc(100vh - 290px);min-height:300px;overflow:hidden;border:2px solid #3b4c40;border-radius:3px;background-color:var(--verde);background-image:linear-gradient(90deg,#ffffff22 50%,transparent 50%);background-size:12.5% 100%;box-shadow:0 5px 15px #1b2a1c18;touch-action:none}
.field-svg,.drawing-canvas,#players{position:absolute;inset:0;width:100%;height:100%}
.field-svg{pointer-events:none}.drawing-canvas{touch-action:none}#players{pointer-events:none}
.player{position:absolute;z-index:3;display:grid;place-items:center;width:42px;height:42px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;background:#c62828;box-shadow:0 2px 7px #10271955,0 0 0 1px #8b1616;color:#fff;cursor:grab;touch-action:none;user-select:none;pointer-events:auto;transition:box-shadow .12s,transform .12s}
.player:before{position:absolute;inset:4px;border:1px solid #ffffffa6;border-radius:50%;content:"";pointer-events:none}
.player-number{position:relative;z-index:1;font-size:13px;font-weight:800;letter-spacing:-.3px;color:#fff;text-shadow:0 1px 1px #71300c}
.player.rival{background:#343b43;box-shadow:0 2px 7px #10271955,0 0 0 1px #20252a}
.player.rival .player-number{text-shadow:0 1px 1px #111}
.player.selected{outline:2px solid #202020;outline-offset:4px;transform:translate(-50%,-50%) scale(1.08)}
.pitch-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px 0;color:#777;font-size:9px}
.pitch-footer strong{color:#222}
.studio-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--borde);background:#fbfbfc;color:#888;font-size:8px;font-weight:800;letter-spacing:.7px}
.studio-foot .shortcuts{font-weight:600;letter-spacing:0}
body.immersive{overflow:hidden;background:#f5f6f7}
body.immersive .barra-superior,body.immersive #sidebar,body.immersive .capa-sidebar,body.immersive .intro{display:none!important}
body.immersive .contenedor{display:block;min-height:0}
body.immersive .main{position:fixed;inset:0;z-index:9999;width:100vw;height:100dvh;overflow:auto;padding:8px!important;background:#f5f6f7}
body.immersive .pizarra-shell{display:flex;flex-direction:column;width:100%;height:100%;max-width:none}
body.immersive .studio{display:flex;flex:1;flex-direction:column;min-height:0}
body.immersive .workspace{flex:1;min-height:0}
body.immersive .pitch-stage{min-height:0}
body.immersive .pitch-wrap{flex:1;min-height:0}
body.immersive .pitch{width:100%;height:100%;min-height:0;max-height:none;aspect-ratio:auto}
@media(max-width:900px){.main{padding:13px}.workspace{grid-template-columns:58px minmax(0,1fr)}.pitch-wrap{min-height:280px}.pitch{min-height:250px;max-height:none}.player{width:35px;height:35px}}
@media(max-width:620px){.main{padding:9px}.intro{margin-bottom:10px}.intro-tag{display:none}.studio{border-radius:10px}.studio-head{align-items:flex-start;padding:10px}.actions{justify-content:flex-end}.actions .btn{min-height:31px;padding:0 8px;font-size:9px}.brand small{font-size:7px}.controlbar{gap:8px;padding:9px}.control-group{flex:1;min-width:0}.control-group select{flex:1;min-width:0;width:100%}.control-label{font-size:8px}.separator{display:none}.control-actions{width:100%;justify-content:space-between}.workspace{grid-template-columns:1fr}.toolrail{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;padding:7px;border-right:0;border-bottom:1px solid var(--borde)}.rail-label{grid-column:1/-1;margin:2px}.tool{min-height:42px}.tool span{font-size:17px}.rail-divider{display:none}.palette{grid-column:1/-1;display:flex;justify-content:center;gap:14px;padding:7px}.width-control{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;padding:0 8px}.width-control input{flex:1}.pitch-stage{padding:8px}.pitch-wrap{min-height:0;padding:3px}.pitch{min-height:0;aspect-ratio:3/2}.player{width:28px;height:28px}.player-number{font-size:10px}.pitch-footer{font-size:8px}.studio-foot{font-size:7px}.shortcuts{display:none!important}body.immersive .pitch{height:auto;aspect-ratio:3/2}}
@media(max-width:380px){.brand strong{font-size:9px}.actions .btn{padding:0 6px}.icon-btn{width:30px}.player{width:25px;height:25px}.player-number{font-size:9px}}
@media print{.barra-superior,#sidebar,.capa-sidebar,.intro,.studio-head,.controlbar,.toolrail,.rival-strip,.studio-foot{display:none!important}.main{margin:0;padding:0!important;background:#fff}.studio{border:0;box-shadow:none}.pitch-stage{padding:0}.pitch-wrap{padding:0;border:0}.pitch{width:100%;max-height:none;print-color-adjust:exact;-webkit-print-color-adjust:exact}}

/* ===== BARRA SUPERIOR DE HERRAMIENTAS Y EDICION INFERIOR ===== */
.controlbar{display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(150px,1fr);align-items:center;gap:12px;min-height:58px;padding:6px 14px}

<script>
(function(){

var pitch=$("pitch"),canvas=$("draw"),ctx=canvas.getContext("2d");
var formations={
"4-3-3":[[.10,.50],[.29,.17],[.29,.39],[.29,.61],[.29,.83],[.51,.28],[.51,.50],[.51,.72],[.76,.17],[.83,.50],[.76,.83]],
"4-4-2":[[.10,.50],[.29,.17],[.29,.39],[.29,.61],[.29,.83],[.52,.17],[.52,.39],[.52,.61],[.52,.83],[.80,.36],[.80,.64]],
"4-2-3-1":[[.10,.50],[.29,.17],[.29,.39],[.29,.61],[.29,.83],[.47,.38],[.47,.62],[.67,.17],[.67,.50],[.67,.83],[.84,.50]],
"3-5-2":[[.10,.50],[.29,.25],[.29,.50],[.29,.75],[.51,.12],[.51,.31],[.51,.50],[.51,.69],[.51,.88],[.80,.36],[.80,.64]],

};
var players=formations["4-3-3"].map(function(p,i){return{id:"own-"+(i+1),team:"own",number:String(i+1),x:p[0],y:p[1]};});
var drawings=[],tool="select",color="#c62828",lineWidth=4,selected=null,drawing=false,start=null,points=[],history=[],future=[];
var clone=function(v){return JSON.parse(JSON.stringify(v));};
function status(t){$("status").textContent=t;}
function syncHistory(){$("undo").disabled=!history.length;$("redo").disabled=!future.length;}
function snapshot(){history.push({players:clone(players),drawings:clone(drawings)});if(history.length>80)history.shift();future=[];syncHistory();}
function syncCount(){}
function setField(){$("fieldSvg").innerHTML='<g fill="none" stroke="#f7fff7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="876" height="576"/><line x1="450" y1="12" x2="450" y2="588"/><circle cx="450" cy="300" r="88"/><circle cx="450" cy="300" r="4" fill="#f7fff7" stroke="none"/><rect x="12" y="150" width="165" height="300"/><rect x="12" y="225" width="55" height="150"/><rect x="723" y="150" width="165" height="300"/><rect x="833" y="225" width="55" height="150"/><circle cx="122" cy="300" r="4" fill="#f7fff7" stroke="none"/><circle cx="778" cy="300" r="4" fill="#f7fff7" stroke="none"/><path d="M177 226 A78 78 0 0 1 177 374 M723 226 A78 78 0 0 0 723 374"/><path d="M12 30 A18 18 0 0 0 30 12 M870 12 A18 18 0 0 0 888 30 M12 570 A18 18 0 0 1 30 588 M870 588 A18 18 0 0 1 888 570"/><rect x="-8" y="260" width="20" height="80"/><rect x="888" y="260" width="20" height="80"/></g>';}
function coords(e){var r=pitch.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}
function drawOne(d,g,w,h){var x=d.x*w,y=d.y*h,X=d.X*w,Y=d.Y*h;g.save();g.strokeStyle=d.color;g.fillStyle=d.color;g.lineWidth=4;g.lineCap="round";g.lineJoin="round";g.setLineDash(d.type==="dash"?[10,8]:[]);g.beginPath();if(d.type==="free"){(d.points||[]).forEach(function(p,i){if(i)g.lineTo(p.x*w,p.y*h);else g.moveTo(p.x*w,p.y*h);});}else if(d.type==="zone"){g.ellipse((x+X)/2,(y+Y)/2,Math.max(2,Math.abs(X-x)/2),Math.max(2,Math.abs(Y-y)/2),0,0,Math.PI*2);}else{g.moveTo(x,y);g.lineTo(X,Y);if(d.type==="arrow"){var a=Math.atan2(Y-y,X-x),len=20;g.moveTo(X,Y);g.lineTo(X-len*Math.cos(a-.5),Y-len*Math.sin(a-.5));g.moveTo(X,Y);g.lineTo(X-len*Math.cos(a+.5),Y-len*Math.sin(a+.5));}}g.stroke();g.restore();}
function paint(){var r=pitch.getBoundingClientRect(),dpr=window.devicePixelRatio||1;if(!r.width||!r.height)return;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(dpr,0,0,dpr,0,0);drawings.forEach(function(d){drawOne(d,ctx,r.width,r.height);});if(drawing&&start&&points.length)drawOne({type:tool,x:start.x,y:start.y,X:points[points.length-1].x,Y:points[points.length-1].y,points:points,color:color},ctx,r.width,r.height);}
function renderPlayers(){var host=$("players");host.replaceChildren();players.forEach(function(p){var el=document.createElement("button");el.type="button";el.className="player "+p.team+(p.id===selected?" selected":"");el.style.left=(p.x*100)+"%";el.style.top=(p.y*100)+"%";el.setAttribute("aria-label",p.team==="own"?"Ficha de SAN TELMO":"Ficha del rival");el.title=p.team==="own"?"Ficha SAN TELMO":"Ficha rival";el.addEventListener("pointerdown",function(e){if(tool!=="select")return;e.preventDefault();e.stopPropagation();snapshot();selected=p.id;host.querySelectorAll(".player.selected").forEach(function(x){x.classList.remove("selected");});el.classList.add("selected");var pointerId=e.pointerId;try{el.setPointerCapture(pointerId);}catch(err){}var move=function(v){if(v.pointerId!==pointerId)return;var q=coords(v);p.x=Math.max(.025,Math.min(.975,q.x));p.y=Math.max(.035,Math.min(.965,q.y));el.style.left=(p.x*100)+"%";el.style.top=(p.y*100)+"%";};var end=function(v){if(v&&v.pointerId!==pointerId)return;window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",end);window.removeEventListener("pointercancel",end);renderPlayers();status("Posición actualizada");};window.addEventListener("pointermove",move);window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);});host.append(el);});syncCount();}
function resize(){var r=pitch.getBoundingClientRect(),dpr=window.devicePixelRatio||1;if(!r.width||!r.height)return;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";paint();}
function setFormation(team,formation){var group=players.filter(function(p){return p.team===team;});formations[formation].forEach(function(q,i){if(group[i]){group[i].x=team==="rival"?1-q[0]:q[0];group[i].y=q[1];}});}
function updateOwn(){snapshot();setFormation("own",$("formationOwn").value);renderPlayers();paint();status("Formación SAN TELMO "+$("formationOwn").value+" aplicada");}
function addRival(){var active=players.some(function(p){return p.team==="rival";});snapshot();if(active){players=players.filter(function(p){return p.team!=="rival";});$("addRival").setAttribute("aria-pressed","false");$("addRival").title="Agregar formación rival";$("addRival").setAttribute("aria-label","Agregar formación rival");renderPlayers();paint();status("Formación rival quitada");return;}var formation=$("formationRival").value;formations[formation].forEach(function(q,i){players.push({id:"rival-"+(i+1),team:"rival",number:String(i+1),x:1-q[0],y:q[1]});});$("addRival").setAttribute("aria-pressed","true");$("addRival").title="Quitar formación rival";$("addRival").setAttribute("aria-label","Quitar formación rival");renderPlayers();paint();status("Equipo rival incorporado · 11 fichas");}
$("formationOwn").addEventListener("change",updateOwn);
$("addRival").addEventListener("click",addRival);
document.querySelectorAll("[data-tool]").forEach(function(b){b.addEventListener("click",function(){tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(function(x){x.classList.toggle("active",x===b);});status("Herramienta: "+b.querySelector("small").textContent);});});
document.querySelectorAll("[data-color]").forEach(function(b){b.addEventListener("click",function(){color=b.dataset.color;document.querySelectorAll("[data-color]").forEach(function(x){x.classList.toggle("active",x===b);});});});
canvas.addEventListener("pointerdown",function(e){if(tool==="select")return;e.preventDefault();drawing=true;start=coords(e);points=[start];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener("pointermove",function(e){if(!drawing)return;var q=coords(e);if(tool==="free")points.push(q);else points=[start,q];paint();});
canvas.addEventListener("pointerup",function(e){if(!drawing)return;drawing=false;var end=coords(e);if(Math.hypot(end.x-start.x,end.y-start.y)<.004&&tool!=="free"){paint();return;}snapshot();drawings.push(tool==="free"?{type:"free",points:clone(points),x:start.x,y:start.y,X:end.x,Y:end.y,color:color}:{type:tool,x:start.x,y:start.y,X:end.x,Y:end.y,color:color});points=[];paint();status("Trazo agregado");});
canvas.addEventListener("pointercancel",function(){drawing=false;points=[];paint();});
$("undo").addEventListener("click",function(){if(!history.length)return;future.push({players:clone(players),drawings:clone(drawings)});var s=history.pop();players=s.players;drawings=s.drawings;renderPlayers();paint();syncHistory();status("Último cambio deshecho");});
$("redo").addEventListener("click",function(){if(!future.length)return;history.push({players:clone(players),drawings:clone(drawings)});var s=future.pop();players=s.players;drawings=s.drawings;renderPlayers();paint();syncHistory();status("Cambio recuperado");});

var immersive=$("toggleImmersive"),showControls=$("showControls");
function syncImmersive(){var on=document.body.classList.contains("immersive");immersive.querySelector("small").textContent=on?"Salir":"Modo inmersivo";immersive.querySelector("span").textContent=on?"⤢":"⛶";immersive.setAttribute("aria-pressed",String(on));if(showControls){showControls.setAttribute("aria-expanded","true");showControls.hidden=true;}}
