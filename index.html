<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f6f8">
<meta name="description" content="Acceso a las plataformas de gestión deportiva de cada club.">
<title>Gestión deportiva | Seleccionar club</title>
<style>
:root{--bg:#f5f6f8;--ink:#202833;--muted:#77818c;--line:#e6e9ed;--orange:#f47721}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif}
.page{width:min(1120px,calc(100% - 44px));margin:0 auto}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e1e5e9}
.brand{display:flex;align-items:center;gap:11px;font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}
.brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;background:#202b36;color:#fff;font-size:14px}
.header-note{font-size:10px;color:#89929b;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
main{padding:43px 0 30px}
.intro{margin:0 0 25px}
.intro h1{margin:0;font-size:21px;line-height:1.25;font-weight:850;letter-spacing:-.025em}
.intro p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
.clubs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.club{--accent:#f47721;--soft:#fff0e5;display:flex;min-width:0;min-height:205px;flex-direction:column;align-items:center;justify-content:flex-start;padding:22px 12px 17px;border:1px solid var(--line);border-radius:15px;background:#fff;text-align:center;text-decoration:none;box-shadow:0 3px 12px rgba(22,32,43,.035);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.club:hover,.club:focus-visible{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 24px rgba(22,32,43,.09);outline:none}
.club.adiur{--accent:#f47721;--soft:#fff0e5}
.club.torito{--accent:#e77825;--soft:#fff1e7}
.club.santelmo{--accent:#174a7e;--soft:#eaf1f8}
.club.sjorge{--accent:#168451;--soft:#e8f5ee}
.club.sbenito{--accent:#c41424;--soft:#fbeaec}
.club.banco{--accent:#173e70;--soft:#edf3fa}
.crest{width:112px;height:112px;display:flex;align-items:center;justify-content:center;margin-bottom:15px;padding:9px;border-radius:13px;background:var(--soft)}
.crest img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.club-name{display:block;margin-top:auto;color:var(--accent);font-size:14px;font-weight:900;letter-spacing:.035em;line-height:1.25;overflow-wrap:anywhere}
.club-caption{display:block;margin-top:6px;color:#9aa2aa;font-size:9px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
footer{display:flex;justify-content:space-between;gap:14px;margin-top:28px;padding:16px 0 22px;border-top:1px solid #e1e5e9;color:#929aa2;font-size:10px;font-weight:650}
@media(max-width:900px){.clubs{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.club{min-height:190px}.crest{width:104px;height:104px}}
@media(max-width:520px){.page{width:calc(100% - 28px)}header{height:64px}.header-note{display:none}main{padding:29px 0 20px}.intro{margin-bottom:19px}.intro h1{font-size:19px}.intro p{font-size:12px}.clubs{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.club{min-height:158px;padding:13px 6px 12px;border-radius:12px}.crest{width:min(100%,82px);height:82px;margin-bottom:11px;padding:7px;border-radius:10px}.club-name{font-size:11px}.club-caption{font-size:8px;margin-top:5px}footer{flex-direction:column;gap:6px;font-size:9px}}
@media(max-width:340px){.clubs{grid-template-columns:repeat(2,minmax(0,1fr))}.club{min-height:170px}.crest{width:94px;height:94px}.club-name{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true">G</span><span>Gestión deportiva</span></div>
  <div class="header-note">Acceso institucional</div>
</header>
<main>
  <section class="intro" aria-labelledby="titulo">
    <h1 id="titulo">Seleccioná tu club</h1>
    <p>Elegí la institución para ingresar a su plataforma de gestión.</p>
  </section>
  <nav class="clubs" aria-label="Seleccionar institución">
    <a class="club adiur" href="ADIUR/ADIUR-Loing.html" aria-label="Ingresar a ADIUR">
      <span class="crest"><img src="ADIUR/ADIUR-Logo ADIUR.jpg" alt="Escudo de ADIUR"></span>
      <span class="club-name">ADIUR</span><span class="club-caption">Ingresar</span>
    </a>
    <a class="club torito" href="TORITO/TORITO-Loing.html" aria-label="Ingresar a TORITO">
      <span class="crest"><img src="TORITO/TORITO - Logo.png" alt="Escudo de TORITO"></span>
      <span class="club-name">TORITO</span><span class="club-caption">Ingresar</span>
    </a>
    <a class="club santelmo" href="SAN TELMO/SAN TELMO-Loing.html" aria-label="Ingresar a SAN TELMO">
      <span class="crest"><img src="SAN TELMO/SAN TELMO.png" alt="Escudo de SAN TELMO"></span>
      <span class="club-name">SAN TELMO</span><span class="club-caption">Ingresar</span>
    </a>
    <a class="club sjorge" href="SAN JORGE/SAN JORGE-Loing.html" aria-label="Ingresar a SAN JORGE">
      <span class="crest"><img src="SAN JORGE/SAN JORGE - Logo.png" alt="Escudo de SAN JORGE"></span>
      <span class="club-name">SAN JORGE</span><span class="club-caption">Ingresar</span>
    </a>
    <a class="club sbenito" href="SAN BENITO/SAN BENITO-Loing.html" aria-label="Ingresar a SAN BENITO">
      <span class="crest"><img src="SAN BENITO/SAN BENITO - Logo.jpg" alt="Escudo de SAN BENITO"></span>
      <span class="club-name">SAN BENITO</span><span class="club-caption">Ingresar</span>
    </a>
    <a class="club banco" href="BANCO/BANCO-Loing.html" aria-label="Ingresar a BANCO">
      <span class="crest"><img src="BANCO/CLUBES/BANCO.jpg" alt="Escudo de BANCO"></span>
      <span class="club-name">BANCO</span><span class="club-caption">Ingresar</span>
    </a>
  </nav>
</main>
<footer><span>Plataforma de gestión deportiva</span><span>Acceso exclusivo para instituciones</span></footer>
</div>
</body>
</html>
