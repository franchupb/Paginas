<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Multimedia | HORIZONTE</title>
<script src="HORIZONTE-permisos.js?v=20261128-cabecera1"></script>
<style>
:root{--azul:#0874b9;--azul-oscuro:#07558a;--fondo:#f4f5f7;--texto:#171717;--suave:#747474;--borde:#e8e8e8}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--texto)}
.barra-superior{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;min-height:88px;padding:8px 24px;background:#fff;border-bottom:1px solid var(--borde)}
.boton-menu{width:42px;height:42px;flex-shrink:0;border:0;background:#fff;border-radius:9px;font-size:27px;color:var(--texto);cursor:pointer}
.logo-superior{width:58px;height:58px;object-fit:contain;padding:2px;background:#fff}
.titulo-superior{flex:1;min-width:0}
.titulo-superior h1{margin:0 0 5px;color:var(--azul);font-size:23px;font-weight:900;letter-spacing:.5px}
.titulo-superior p{margin:0;color:var(--suave);font-size:13px}
.perfil{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;display:grid;place-items:center;flex-shrink:0;background:var(--azul);color:#fff;border-radius:50%;font-weight:900}
.nombre-perfil{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800;color:var(--azul)}
.rol-perfil{margin-top:4px;color:var(--suave);font-size:11px}
.contenedor{display:flex;min-height:calc(100vh - 88px)}
.sidebar{width:258px;flex:0 0 258px;background:#fff;border-right:1px solid var(--borde)}
main.main{flex:1;min-width:0;padding:28px}
.tarjeta-multimedia{width:min(100%,760px);margin:35px auto;padding:42px 30px;text-align:center;background:#fff;border:1px solid var(--borde);border-radius:18px;box-shadow:0 4px 18px #00000008}
.logo-multimedia{width:104px;height:104px;object-fit:contain;margin-bottom:18px}
.etiqueta{display:inline-block;padding:7px 11px;border-radius:999px;background:#e8f5fa;color:var(--azul-oscuro);font-size:10px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase}
.tarjeta-multimedia h2{margin:17px 0 10px;font-size:30px}
.tarjeta-multimedia p{max-width:500px;margin:0 auto;color:var(--suave);font-size:14px;line-height:1.7}
.estado{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:10px 13px;border:1px solid #d7e8ef;border-radius:12px;background:#f4f9fc;color:var(--azul-oscuro);font-size:12px;font-weight:800}
.estado:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--azul)}
@media(max-width:760px){.barra-superior{min-height:72px;padding:6px 12px;gap:9px}.boton-menu{width:38px;height:38px;font-size:24px}.logo-superior{width:48px;height:48px}.titulo-superior h1{font-size:16px}.titulo-superior p{font-size:11px}.nombre-perfil{max-width:70px;font-size:12px}.rol-perfil{display:none}.avatar{width:36px;height:36px}.contenedor{min-height:calc(100vh - 72px)}main.main{padding:20px 14px}.tarjeta-multimedia{margin:12px auto;padding:32px 20px}}
</style>
</head>
<body>
<header class="barra-superior">
  <button class="boton-menu" id="botonMenu" type="button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="true">☰</button>
  <img class="logo-superior" src="HORIZONTE - Logo2.png" alt="Escudo oficial de HORIZONTE">
  <div class="titulo-superior"><h1>HORIZONTE</h1><p>Multimedia</p></div>
  <div class="perfil" id="perfilUsuario">
    <div class="avatar" id="avatarUsuario">U</div>
    <div><div class="nombre-perfil" id="nombreUsuario">Usuario</div><div class="rol-perfil" id="rolUsuario">Club HORIZONTE</div></div>
  </div>
</header>
<div class="capa-sidebar" id="capaSidebar"></div>
<div class="contenedor">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <section class="tarjeta-multimedia">
      <img class="logo-multimedia" src="HORIZONTE - Logo.png" alt="Escudo de HORIZONTE">
      <div class="etiqueta">HORIZONTE · GESTIÓN DEPORTIVA</div>
      <h2>Multimedia</h2>
      <p>Este espacio está reservado para reunir fotografías y videos de entrenamientos, partidos y actividades del plantel.</p>
      <div class="estado">Sección en preparación</div>
    </section>
  </main>
</div>
<script type="module" src="HORIZONTE-layout.js?v=20261128-cabecera1"></script>
</body>
</html>
